<html>
  <body
    style="
      margin: 0;
      background: #0a0a0a;
      color: #f7f3eb;
      font-family: Georgia, 'Times New Roman', serif;
      padding: 32px;
    "
  >
    <div
      style="
        border: 1px solid rgba(202, 158, 91, 0.38);
        padding: 28px;
        max-width: 560px;
      "
    >
      <p
        style="
          color: #ca9e5b;
          font-family: Arial, sans-serif;
          font-size: 11px;
          letter-spacing: 0.24em;
          text-transform: uppercase;
        "
      >
        TARA Newsletter
      </p>
      <h1 style="font-size: 34px; line-height: 1; margin: 18px 0 0;">
        New subscriber.
      </h1>
      <p
        style="
          color: rgba(247, 243, 235, 0.72);
          font-family: Arial, sans-serif;
          font-size: 15px;
          line-height: 1.7;
          margin: 22px 0 0;
        "
      >
        {{email}} joined the TARA list from {{source}}.
      </p>
      <p
        style="
          color: rgba(247, 243, 235, 0.5);
          font-family: Arial, sans-serif;
          font-size: 12px;
          line-height: 1.7;
          margin: 22px 0 0;
        "
      >
        Submitted at {{submittedAt}}.
      </p>
    </div>
  </body>
</html>
